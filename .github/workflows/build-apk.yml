name: Build Jeet Sir Academy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir build-src
          unzip -q JeetSirAcademyApp_PlayStoreReady.zip -d build-src
          find build-src -maxdepth 3 -type f -name "settings.gradle*" -o -name "build.gradle*"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          PROJECT=$(find build-src -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jeet-Sir-Academy-APK
          path: build-src/**/build/outputs/apk/debug/*.apk
